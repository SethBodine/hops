<noscript>
  <div style="max-width:640px;margin:40px auto;padding:24px;font-family:sans-serif;line-height:1.6;">
    <h1>Hops — Free Homebrew Recipe Builder</h1>
    <p>Hops is a free, self-contained homebrew recipe builder — a spiritual replacement for
    BeerSmith that runs entirely in your browser. There's no account, no server, and no cost;
    recipes, brew logs, inventory, and equipment profiles are all stored locally in your
    browser, with JSON backup/restore, BeerXML import/export, and shareable recipe links.</p>
    <p>Hops requires JavaScript to run, since it has no server component at all — please
    enable JavaScript to use it.</p>
    <h2>Frequently asked questions</h2>
    <p><strong>Does Hops require an account?</strong> No. There's no sign-up and no
    server-side account. Recipes, batches, and inventory are all stored locally in your
    browser.</p>
    <p><strong>Is Hops really free?</strong> Yes, Hops is free with no subscription, and it's
    open source.</p>
    <p><strong>Will I lose my recipes if I clear my browser data?</strong> Recipes are stored
    in your browser's local storage, so clearing site data will remove them. Use Export
    Backup to save a JSON file you can restore from at any time, on any device.</p>
    <p><strong>Can I import my existing BeerSmith recipes?</strong> Yes, Hops supports
    BeerXML import and export, the standard format BeerSmith itself uses.</p>
    <p><strong>How do shared recipe links work?</strong> A recipe compresses into a URL that
    opens straight into the app on any device. Opening a shared link never silently
    overwrites your existing data — it always asks first whether to add it as new or update
    an existing recipe.</p>
  </div>
</noscript>
